name: Build Release

on:
  workflow_dispatch:
    inputs:
      client_name:
        description: 'Nome da empresa'
        required: false
        default: 'Financia'
      logo_url:
        description: 'URL publica do logo'
        required: false
        default: ''
      primary_color:
        description: 'Cor HEX sem # (ex: 002f59)'
        required: false
        default: '002f59'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.rename.outputs.apk_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias de icones
        run: |
          sudo apt-get install -y librsvg2-bin 2>/dev/null || true
          pip install Pillow --break-system-packages --quiet

      - name: Instalar componentes Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" "build-tools;33.0.2" 2>&1 | tail -3

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL "https://github.com/gradle/gradle/raw/v7.5.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Aplicar nome do app
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'Financia' }}
        run: |
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$CLIENT_NAME</string>|" \
            android/app/src/main/res/values/strings.xml
          echo "App name: $CLIENT_NAME"

      - name: Baixar logo do cliente
        env:
          LOGO_URL: ${{ github.event.inputs.logo_url || '' }}
        run: |
          if [ -n "$LOGO_URL" ]; then
            curl -fsSL "$LOGO_URL" -o /tmp/logo --max-time 20 && echo "Logo OK" || echo "Sem logo URL"
          fi

      - name: Gerar icones PNG
        env:
          HEX_COLOR: ${{ github.event.inputs.primary_color || '002f59' }}
        run: python3 scripts/gen_icons.py

      - name: Verificar icones gerados
        run: find android -name "ic_launcher.png" | xargs ls -lh 2>/dev/null

      - name: Restaurar keystore permanente
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/financia.jks
          ls -lh android/app/financia.jks

      - name: Build APK Release
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -20
          exit ${PIPESTATUS[0]}
        env:
          STORE_FILE: financia.jks
          STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: Renomear APK
        id: rename
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'financia' }}
        run: |
          mkdir -p apk-output
          SAFE=$(echo "$CLIENT_NAME" | tr ' ' '-' | tr -cd 'a-zA-Z0-9-' | tr '[:upper:]' '[:lower:]')
          SAFE=${SAFE:-financia}
          find android -name "*release*.apk" -exec cp {} "apk-output/${SAFE}.apk" \;
          find android -name "*.apk" | head -1 | xargs -I{} cp {} "apk-output/${SAFE}.apk" 2>/dev/null || true
          ls -lh apk-output/
          echo "apk_name=${SAFE}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-${{ github.event.inputs.client_name || 'financia' }}
          path: apk-output/
          retention-days: 90
          if-no-files-found: warn

      - name: Salvar APK para release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-apk
          path: apk-output/
          retention-days: 1

  build-pwa:
    runs-on: ubuntu-latest
    outputs:
      pwa_name: ${{ steps.rename.outputs.pwa_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Vite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('vite.config.js', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm install

      - name: Build PWA
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          test -f dist/index.html && echo "index.html OK" || (echo "index.html MISSING" && exit 1)
          test -f dist/manifest.json && echo "manifest.json OK" || (echo "manifest.json MISSING" && exit 1)
          test -f dist/sw.js && echo "sw.js OK" || echo "sw.js not found (optional)"
          find dist/ -type f | head -20

      - name: Renomear PWA
        id: rename
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'financia' }}
        run: |
          SAFE=$(echo "$CLIENT_NAME" | tr ' ' '-' | tr -cd 'a-zA-Z0-9-' | tr '[:upper:]' '[:lower:]')
          SAFE=${SAFE:-financia}
          mkdir -p pwa-output
          tar -czf "pwa-output/${SAFE}-pwa.tar.gz" -C dist .
          echo "pwa_name=${SAFE}-pwa.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload PWA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pwa-${{ github.event.inputs.client_name || 'financia' }}
          path: pwa-output/
          retention-days: 90
          if-no-files-found: warn

      - name: Salvar PWA para release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-pwa
          path: pwa-output/
          retention-days: 1

  build-electron-macos:
    runs-on: macos-latest
    outputs:
      dmg_name: ${{ steps.build.outputs.dmg_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Instalar Python Pillow
        run: pip install Pillow

      - name: Baixar logo do cliente
        env:
          LOGO_URL: ${{ github.event.inputs.logo_url || '' }}
        shell: bash
        run: |
          if [ -n "$LOGO_URL" ]; then
            curl -fsSL "$LOGO_URL" -o /tmp/logo --max-time 20 && echo "Logo OK" || echo "Sem logo"
          fi

      - name: Gerar icone macOS
        env:
          HEX_COLOR: ${{ github.event.inputs.primary_color || '002f59' }}
        run: python scripts/gen_icon_macos.py 2>/dev/null || echo "gen_icon_macos.py not found, skipping"

      - name: Aplicar nome do app
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'Financia' }}
        shell: bash
        run: |
          sed -i "s|\"productName\": \".*\"|\"productName\": \"$CLIENT_NAME\"|" package.json

      - name: Build Electron macOS DMG
        id: build
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'financia' }}
        shell: bash
        run: |
          npx electron-builder --mac --publish never
          SAFE=$(echo "$CLIENT_NAME" | tr ' ' '-' | tr -cd 'a-zA-Z0-9-' | tr '[:upper:]' '[:lower:]')
          SAFE=${SAFE:-financia}
          find dist -name "*.dmg" | head -1 | xargs -I{} cp {} "${SAFE}.dmg" 2>/dev/null || true
          ls -lh *.dmg 2>/dev/null
          echo "dmg_name=${SAFE}.dmg" >> "$GITHUB_OUTPUT"

      - name: Salvar DMG para release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dmg
          path: "*.dmg"
          retention-days: 1

  build-electron-linux:
    runs-on: ubuntu-latest
    outputs:
      deb_name: ${{ steps.build.outputs.deb_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Instalar dependencias de empacotamento
        run: |
          sudo apt-get install -y librsvg2-bin 2>/dev/null || true
          pip install Pillow --break-system-packages --quiet

      - name: Baixar logo do cliente
        env:
          LOGO_URL: ${{ github.event.inputs.logo_url || '' }}
        shell: bash
        run: |
          if [ -n "$LOGO_URL" ]; then
            curl -fsSL "$LOGO_URL" -o /tmp/logo --max-time 20 && echo "Logo OK" || echo "Sem logo"
          fi

      - name: Gerar icone Linux
        env:
          HEX_COLOR: ${{ github.event.inputs.primary_color || '002f59' }}
        run: python scripts/gen_icon_linux.py 2>/dev/null || echo "gen_icon_linux.py not found, skipping"

      - name: Aplicar nome do app
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'Financia' }}
        shell: bash
        run: |
          sed -i "s|\"productName\": \".*\"|\"productName\": \"$CLIENT_NAME\"|" package.json

      - name: Build Electron Linux DEB
        id: build
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'financia' }}
        shell: bash
        run: |
          npx electron-builder --linux --publish never
          SAFE=$(echo "$CLIENT_NAME" | tr ' ' '-' | tr -cd 'a-zA-Z0-9-' | tr '[:upper:]' '[:lower:]')
          SAFE=${SAFE:-financia}
          find dist -name "*.deb" | head -1 | xargs -I{} cp {} "${SAFE}.deb" 2>/dev/null || true
          find dist -name "*.AppImage" | head -1 | xargs -I{} cp {} "${SAFE}.AppImage" 2>/dev/null || true
          ls -lh *.deb *.AppImage 2>/dev/null
          echo "deb_name=${SAFE}.deb" >> "$GITHUB_OUTPUT"

      - name: Salvar DEB para release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-deb
          path: "*.deb"
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    outputs:
      exe_name: ${{ steps.build.outputs.exe_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Python Pillow
        run: pip install Pillow

      - name: Baixar logo do cliente
        env:
          LOGO_URL: ${{ github.event.inputs.logo_url || '' }}
        shell: bash
        run: |
          if [ -n "$LOGO_URL" ]; then
            curl -fsSL "$LOGO_URL" -o /tmp/logo --max-time 20 && echo "Logo OK" || echo "Sem logo"
          fi

      - name: Gerar icone Windows
        env:
          HEX_COLOR: ${{ github.event.inputs.primary_color || '002f59' }}
        run: python scripts/gen_icon_win.py

      - name: Aplicar nome do app
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'Financia' }}
        shell: bash
        run: |
          sed -i "s|\"productName\": \".*\"|\"productName\": \"$CLIENT_NAME\"|" package.json

      - name: Build Windows exe
        id: build
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'financia' }}
        shell: bash
        run: |
          npx electron-builder --win --publish never
          SAFE=$(echo "$CLIENT_NAME" | tr ' ' '-' | tr -cd 'a-zA-Z0-9-' | tr '[:upper:]' '[:lower:]')
          SAFE=${SAFE:-financia}
          find dist -name "*.exe" | head -1 | xargs -I{} cp {} "${SAFE}-setup.exe" 2>/dev/null || true
          ls -lh *.exe 2>/dev/null
          echo "exe_name=${SAFE}-setup.exe" >> "$GITHUB_OUTPUT"

      - name: Salvar exe para release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-exe
          path: "*.exe"
          retention-days: 1

  create-release:
    needs: [build-apk, build-pwa, build-electron-macos, build-electron-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-apk
          path: release-files/

      - name: Baixar PWA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-pwa
          path: release-files/

      - name: Baixar DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-dmg
          path: release-files/

      - name: Baixar DEB
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-deb
          path: release-files/

      - name: Baixar EXE
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-exe
          path: release-files/

      - name: Listar arquivos
        run: ls -lh release-files/

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_NAME: ${{ github.event.inputs.client_name || 'Financia' }}
          PRIMARY_COLOR: ${{ github.event.inputs.primary_color || '002f59' }}
        run: |
          TAG="v$(date +'%Y%m%d%H%M%S')"
          SAFE=$(echo "$CLIENT_NAME" | tr ' ' '-' | tr -cd 'a-zA-Z0-9-')
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $SAFE - $(date +'%Y-%m-%d %H:%M')" \
            --notes "Build automatico para cliente: $CLIENT_NAME (cor: #$PRIMARY_COLOR)" \
            --latest