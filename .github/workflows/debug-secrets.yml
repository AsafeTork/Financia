name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Inline access
        id: inline
        run: |
          echo "inline_access_token_len=${#SECRET_VAR}" ; echo "OK"
        env:
          SECRET_VAR: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Direct access
        run: |
          echo "direct_len=${#SUPABASE_ACCESS_TOKEN}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}