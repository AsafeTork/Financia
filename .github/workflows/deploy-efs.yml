name: Deploy Edge Functions
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase functions deploy admin-impersonate --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy get-payment-method --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy remove-payment-method --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy create-setup-intent --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy admin-create-client --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy admin-set-white-label --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy stripe-config --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy get-subscription-status --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy admin-set-custom-price --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
