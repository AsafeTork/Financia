name: Validate Secrets

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-secrets:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check CI/CD secrets
        run: |
          echo "=== Checking CI/CD Secrets ==="
          MISSING=0

          for SECRET in \
            SUPABASE_URL \
            SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_PROJECT_REF \
            RENDER_SERVICE_ID \
            RENDER_API_KEY \
            KEYSTORE_B64 \
            KEYSTORE_PASS \
            KEY_ALIAS; do
            if [ -z "${!SECRET}" ]; then
              echo "MISSING: $SECRET"
              MISSING=1
            else
              echo "OK: $SECRET is configured"
            fi
          done

          echo ""
          if [ "$MISSING" = "1" ]; then
            echo "ERROR: Some required secrets are missing."
            exit 1
          else
            echo "All required secrets are configured."
          fi

      - name: Check optional secrets
        run: |
          echo "=== Checking Optional Secrets ==="
          for SECRET in \
            DISCORD_WEBHOOK_URL \
            SLACK_WEBHOOK_URL \
            PLAYWRIGHT_USERNAME \
            PLAYWRIGHT_PASSWORD \
            LOGO_URL \
            CLIENT_NAME; do
            if [ -z "${!SECRET}" ]; then
              echo "OPTIONAL: $SECRET is not set (optional)"
            else
              echo "OK: $SECRET is set"
            fi
          done