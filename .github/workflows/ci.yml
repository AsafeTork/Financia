name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=6144'

permissions:
  contents: write

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Lint
        run: npx eslint src/ 2>&1 | tee /tmp/lint-output.txt || true
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee /tmp/typecheck-output.txt || true
      - name: Save lint output
        if: always()
        run: |
          mkdir -p /tmp/ci-artifacts
          cp /tmp/lint-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
          cp /tmp/typecheck-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-typecheck
          path: /tmp/ci-artifacts/
          retention-days: 5

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run test 2>&1 | tee /tmp/test-output.txt || true
      - name: Save test output
        if: always()
        run: |
          mkdir -p /tmp/ci-artifacts
          cp /tmp/test-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          path: /tmp/ci-artifacts/
          retention-days: 5

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run build 2>&1 | tee /tmp/build-output.txt || true
      - name: Save build output
        if: always()
        run: |
          mkdir -p /tmp/ci-artifacts
          cp /tmp/build-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            /tmp/ci-artifacts/
            dist/
          retention-days: 5

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npx audit-ci --config audit-ci.jsonc 2>&1 | tee /tmp/security-output.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit
          path: /tmp/security-output.txt
          retention-days: 5

  production-audit:
    name: Production Audit (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run production audit
        run: npx playwright test --config=playwright.prod.config.ts --project=chromium 2>&1 | tee /tmp/prod-audit-output.txt || true
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Parse results
        if: always()
        run: |
          FILE="prod-audit-results.json"
          if [ -f "$FILE" ]; then
            echo "## Prod Audit (chromium)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            jq -r '"| Passed | \(.stats.expected) |", "| Failed | \(.stats.unexpected) |", "| Skipped | \(.stats.skipped) |"' "$FILE" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No prod audit results file found." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-audit
          path: |
            prod-audit-results.json
            playwright-report/
          retention-days: 5

  admin-audit:
    name: Admin Audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run admin audit
        run: npx playwright test e2e/admin-audit.spec.ts --project=chromium 2>&1 | tee /tmp/admin-audit-output.txt || true
        env:
          PLAYWRIGHT_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
      - name: Upload admin audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-audit-report-md
          path: admin-audit-report.md
          retention-days: 30
      - name: Upload admin audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-audit-results-json
          path: admin-audit-results.json
          retention-days: 30
      - name: Admin audit summary
        if: always()
        run: |
          REPORT="admin-audit-report.md"
          echo "## Admin Audit (production)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No admin audit report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  extract-errors:
    name: Extract Errors & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck, unit-tests, build, security-audit, production-audit, admin-audit, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download CI artifacts
        if: always()
        run: |
          mkdir -p ci-artifacts
          gh run download ${{ github.run_id }} -D ci-artifacts/ || true
          find ci-artifacts/ -type f | head -30 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Generate CI_REPORT.md
        run: python3 scripts/generate-ci-report.py
      - name: Commit CI_REPORT.md
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CI_REPORT.md
          git diff --cached --quiet || git commit -m "chore: update CI_REPORT.md [skip ci]"
          git push
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-md
          path: CI_REPORT.md
          retention-days: 30

  e2e:
    name: E2E Tests (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run build 2>&1 | tail -5
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run critical E2E tests
        run: npx playwright test e2e/auth-flow.spec.ts e2e/brand-studio.spec.ts e2e/dashboard-analytics.spec.ts e2e/offline-state-corruption.spec.ts e2e/deep-sync-conflict.spec.ts e2e/keyboard-navigation.spec.ts e2e/error-boundary-recovery.spec.ts --project=chromium 2>&1 | tee /tmp/e2e-output.txt || true
      - name: Save e2e output
        if: always()
        run: |
          mkdir -p /tmp/ci-artifacts
          cp /tmp/e2e-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-tests
          path: /tmp/ci-artifacts/
          retention-days: 5

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, build, security-audit, production-audit, admin-audit, e2e, extract-errors]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-report-md
          path: .
      - name: Upload CI_REPORT.md artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-report
          path: CI_REPORT.md
          retention-days: 30