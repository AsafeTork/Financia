name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=6144'

permissions:
  contents: write

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Lint
        run: npx eslint src/ 2>&1 | tee /tmp/lint-output.txt || true
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee /tmp/typecheck-output.txt || true
      - name: Save lint output
        if: always()
        run: |
          mkdir -p /tmp/ci-artifacts
          cp /tmp/lint-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
          cp /tmp/typecheck-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-typecheck
          path: /tmp/ci-artifacts/
          retention-days: 5

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run test 2>&1 | tee /tmp/test-output.txt || true
      - name: Save test output
        if: always()
        run: |
          mkdir -p /tmp/ci-artifacts
          cp /tmp/test-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          path: /tmp/ci-artifacts/
          retention-days: 5

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run build 2>&1 | tee /tmp/build-output.txt || true
      - name: Save build output
        if: always()
        run: |
          mkdir -p /tmp/ci-artifacts
          cp /tmp/build-output.txt /tmp/ci-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            /tmp/ci-artifacts/
            dist/
          retention-days: 5

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npx audit-ci --config audit-ci.jsonc 2>&1 | tee /tmp/security-output.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit
          path: /tmp/security-output.txt
          retention-days: 5

  production-audit:
    name: Production Audit (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run production audit
        run: npx playwright test --config=playwright.prod.config.ts --project=chromium 2>&1 | tee /tmp/prod-audit-output.txt || true
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Parse results
        if: always()
        run: |
          FILE="prod-audit-results.json"
          if [ -f "$FILE" ]; then
            echo "## Prod Audit (chromium)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            jq -r '"| Passed | \(.stats.expected) |", "| Failed | \(.stats.unexpected) |", "| Skipped | \(.stats.skipped) |"' "$FILE" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No prod audit results file found." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-audit
          path: |
            prod-audit-results.json
            playwright-report/
          retention-days: 5

  admin-audit:
    name: Admin Audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run admin audit
        run: npx playwright test e2e/admin-audit.spec.ts --project=chromium 2>&1 | tee /tmp/admin-audit-output.txt || true
        env:
          PLAYWRIGHT_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
      - name: Upload admin audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-audit-report-md
          path: admin-audit-report.md
          retention-days: 30
      - name: Upload admin audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-audit-results-json
          path: admin-audit-results.json
          retention-days: 30
      - name: Admin audit summary
        if: always()
        run: |
          REPORT="admin-audit-report.md"
          echo "## Admin Audit (production)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No admin audit report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  extract-errors:
    name: Extract Errors & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck, unit-tests, build, security-audit, production-audit, admin-audit]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ci-artifacts
          pattern: "lint-typecheck,unit-tests,build,security-audit,prod-audit,admin-audit-report-md,admin-audit-results-json"
          merge-multiple: true
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Generate CI_REPORT.md
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # Read lint output
          LINT_STATUS="ok"
          LINT_CONTENT=""
          if [ -f "ci-artifacts/lint-output.txt" ]; then
            LINT_CONTENT=$(cat ci-artifacts/lint-output.txt 2>/dev/null | head -100)
            grep -qiE "error|erro" ci-artifacts/lint-output.txt && LINT_STATUS="com erros" || true
          fi

          # Read test output
          TEST_STATUS="ok"
          TEST_CONTENT=""
          if [ -f "ci-artifacts/test-output.txt" ]; then
            TEST_CONTENT=$(tail -40 ci-artifacts/test-output.txt 2>/dev/null)
            grep -qiE "fail|falha|error|erro|×" ci-artifacts/test-output.txt && TEST_STATUS="com falhas" || true
          fi

          # Read build output
          BUILD_STATUS="ok"
          BUILD_CONTENT=""
          if [ -f "ci-artifacts/build-output.txt" ]; then
            BUILD_CONTENT=$(cat ci-artifacts/build-output.txt 2>/dev/null | tail -30)
            grep -qiE "error|erro|failed|falha" ci-artifacts/build-output.txt && BUILD_STATUS="com erros" || true
          fi

          # Read admin audit report
          ADMIN_AUDIT=""
          if [ -f "ci-artifacts/admin-audit-report-md/admin-audit-report.md" ]; then
            ADMIN_AUDIT=$(cat ci-artifacts/admin-audit-report-md/admin-audit-report.md 2>/dev/null | head -60)
          elif [ -f "admin-audit-report.md" ]; then
            ADMIN_AUDIT=$(cat admin-audit-report.md 2>/dev/null | head -60)
          fi

          # Parse admin audit JSON for metrics
          ADMIN_METRICS=""
          if [ -f "ci-artifacts/admin-audit-results-json/admin-audit-results.json" ]; then
            ERRS=$(jq '.totalErrors' ci-artifacts/admin-audit-results-json/admin-audit-results.json 2>/dev/null || echo "0")
            WARN=$(jq '.totalWarnings' ci-artifacts/admin-audit-results-json/admin-audit-results.json 2>/dev/null || echo "0")
            ADMIN_METRICS="| Erros de console | ${ERRS} |
| Warnings | ${WARN} |"
          fi

          # Read prod audit results
          PROD_METRICS=""
          if [ -f "ci-artifacts/prod-audit/prod-audit-results.json" ]; then
            PX=$(jq -r '.stats.expected // 0' ci-artifacts/prod-audit/prod-audit-results.json 2>/dev/null || echo "0")
            UX=$(jq -r '.stats.unexpected // 0' ci-artifacts/prod-audit/prod-audit-results.json 2>/dev/null || echo "0")
            PROD_METRICS="| Passou | ${PX} |
| Falhou | ${UX} |"
          fi

          cat > CI_REPORT.md << EOF
          # CI Report

          **Gerado:** ${TIMESTAMP}
          **Commit:** \`${COMMIT}\`
          **Branch:** \`${BRANCH}\`

          <details>
          <summary><b>📊 Fluxo do Workflow (clique para expandir)</b></summary>

          \`\`\`mermaid
          flowchart TD
            A[Push para main] --> B[Lint + Typecheck]
            A --> C[Testes Unitários]
            A --> D[Build Web]
            A --> E[Security Audit]
            D --> F[Production Audit chromium]
            D --> G[Admin Audit produção]
            B --> H[Extract Errors]
            C --> H
            E --> H
            F --> H
            G --> H
            H --> I[CI_REPORT.md consolidado]
            I --> J[Commit CI_REPORT.md]
            I --> K[Artifact CI_REPORT.md]

            style A fill:#4CAF50,color:white,stroke:#2E7D32
            style B fill:#2196F3,color:white
            style C fill:#2196F3,color:white
            style D fill:#FF9800,color:white
            style E fill:#9C27B0,color:white
            style F fill:#00BCD4,color:white
            style G fill:#F44336,color:white
            style H fill:#795548,color:white
            style I fill:#4CAF50,color:white,stroke:#2E7D32
            style J fill:#607D8B,color:white
            style K fill:#607D8B,color:white
          \`\`\`

          </details>

          ---

          ## Diagrama de Execução

          \`\`\`
          PUSH → MAIN
            │
            ├── [1] Lint + Typecheck ──────────────────────┐
            │     ✅ / ❌                                      │
            │                                                  ├──→ EXTRACT ERRORS ──→ CI_REPORT.md
            ├── [2] Unit Tests ─────────────────────────────┤     (consolida tudo)
            │     ✅ / ❌                                      │
            │                                                  │
            ├── [3] Build Web ──────────────────────────────┤
            │     ✅ / ❌                                      │
            │               │                                  │
            │               ├──→ [4] Prod Audit (chromium) ──┤
            │               │     ✅ / ❌                      │
            │               │                                  │
            │               └──→ [5] Admin Audit (produção) ─┤
            │                     ✅ / ❌                      │
            │                                                  │
            ├── [6] Security Audit ─────────────────────────┤
            │     ⚠️ / ✅                                      │
            │                                                  │
            └──→ [7] CI_REPORT.md + [8] CI_REPORT.md commit │
          \`\`\`

          ---

          ## Legenda

          | Símbolo | Significado |
          |---------|-------------|
          | ✅ | Passou |
          | ❌ | Faliu |
          | ⚠️ | Warning (não bloqueante) |
          | 📄 | Relatório gerado |
          | 🔧 | Ação de correção |
          | ↳ | Sub-item / detalhe |

          ---

          ## Status Geral

          | Verificação | Status |
          |---|---|
          | Lint + Typecheck | ${LINT_STATUS} |
          | Testes Unitários | ${TEST_STATUS} |
          | Build | ${BUILD_STATUS} |
          | Auditoria de Produção | consultar resultado abaixo |
          | Admin Audit | consultar resultado abaixo |

          ---

          ## Lint Errors (Top 100 linhas)

          \`\`\`
          ${LINT_CONTENT}
          \`\`\`

          ---

          ## Test Results (últimas 40 linhas)

          \`\`\`
          ${TEST_CONTENT}
          \`\`\`

          ---

          ## Build Output (últimas 30 linhas)

          \`\`\`
          ${BUILD_CONTENT}
          \`\`\`

          ---

          ## Produção Audit (chromium)

          | Métrica | Valor |
          |---|---|
          ${PROD_METRICS}
          ---

          ## Admin Audit (produção — Firefox/Chromium)

          ${ADMIN_METRICS}

          Relatório completo admin-audit-report.md disponível como artifact.

          ### Resumo do Admin Audit

          ${ADMIN_AUDIT:-Nenhum relatório admin gerado.}

          ---

          ## Correções Aplicadas Recentemente

          | Data | Correção | Commit |
          |------|----------|--------|
          | ${TIMESTAMP} | CI report gerado automaticamente | \`${COMMIT}\` |
          EOF

          echo "CI_REPORT.md gerado com sucesso."

      - name: Commit CI_REPORT.md
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CI_REPORT.md
          git diff --cached --quiet || git commit -m "chore: update CI_REPORT.md [skip ci]"
          git push
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-md
          path: CI_REPORT.md
          retention-days: 30

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, build, security-audit, production-audit, admin-audit, extract-errors]
    if: always()
    steps:
      - run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint + Typecheck | ${{ needs.lint-typecheck.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prod Audit (chromium) | ${{ needs.production-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Admin Audit | ${{ needs.admin-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Extract Errors & Report | ${{ needs.extract-errors.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📄 Relatório completo: \`CI_REPORT.md\` (salvo como artifact e commitado no repositório)" >> "$GITHUB_STEP_SUMMARY"