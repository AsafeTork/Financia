name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Lint
        run: npx eslint src/ 2>&1 | tee lint-output.txt; EXIT_CODE=${PIPESTATUS[0]}; echo "LINT_EXIT_CODE=$EXIT_CODE"; exit $EXIT_CODE
      - name: Upload lint output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt
      - run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e-tests:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
            install-browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.install-browser }}
      - name: Run Playwright tests
        run: npx playwright test e2e/smoke.spec.ts --project="${{ matrix.project }}"
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run security:audit
        continue-on-error: true

  prod-audit:
    name: Production Audit (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
            install-browser: chromium
          - browser: firefox
            project: firefox
            install-browser: firefox
          - browser: webkit
            project: webkit
            install-browser: webkit
          - browser: mobile-chrome
            project: "Mobile Chrome"
            install-browser: chromium
          - browser: mobile-safari
            project: "Mobile Safari"
            install-browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install --legacy-peer-deps
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.install-browser }}
      - name: Run production audit
        run: npx playwright test --config=playwright.prod.config.ts --project="${{ matrix.project }}"
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-audit-report-${{ matrix.browser }}
          path: playwright-report-prod/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-audit-results-${{ matrix.browser }}
          path: prod-audit-results.json
          retention-days: 7

  extract-errors:
    name: Extract Audit Errors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prod-audit]
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: prod-audit-results-*
          path: audit-results
      - name: Generate error report
        shell: bash
        run: |
          echo "## Production Audit Error Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -d "audit-results" ] || [ -z "$(ls -A audit-results 2>/dev/null)" ]; then
            echo "No audit results artifacts were downloaded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "| Browser | Status | Tests |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|-------|" >> "$GITHUB_STEP_SUMMARY"

          for dir in audit-results/*/; do
            [ -d "$dir" ] || continue
            browser=$(basename "$dir" | sed 's/^prod-audit-results-//')
            file="${dir}prod-audit-results.json"

            if [ ! -f "$file" ]; then
              echo "| $browser | No results | - |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            expected=$(jq -r '.stats.expected // 0' "$file" 2>/dev/null)
            unexpected=$(jq -r '.stats.unexpected // 0' "$file" 2>/dev/null)
            skipped=$(jq -r '.stats.skipped // 0' "$file" 2>/dev/null)

            if [ "$unexpected" -gt 0 ]; then
              status="FAILED"
            else
              status="PASSED"
            fi

            echo "| $browser | $status | $expected passed, $unexpected failed, $skipped skipped |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for dir in audit-results/*/; do
            [ -d "$dir" ] || continue
            browser=$(basename "$dir" | sed 's/^prod-audit-results-//')
            file="${dir}prod-audit-results.json"
            [ ! -f "$file" ] && continue

            echo "### $browser" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            jq -r '
              def section(title; content):
                if content != "" then
                  "**" + title + "**",
                  "```",
                  content,
                  "```",
                  ""
                else
                  empty
                end;

              # Page errors from test output
              (.suites[]?.specs[]?.tests[]?.results[]?.stdout[]?.text // empty) as $report
              | if $report != "" then
                  section("Captured Console & Page Errors"; $report)
                else
                  "No errors captured." ,
                  ""
                end,

              # Global errors
              if (.errors | length) > 0 then
                section("Global Errors"; (.errors | map(.message) | join("\n")))
              else
                empty
              end,

              # Test failures
              if (.stats.unexpected // 0) > 0 then
                "**Failed Tests:**",
                (
                  .suites[]?.specs[]?.tests[]?
                  | select(.results[]?.status != "passed")
                  | "  - **\(.title):** \(.results[]?.status // "unknown")"
                ),
                "",
                (
                  .suites[]?.specs[]?.tests[]?.results[]?.errors[]?
                  | "  ```",
                  "  \(.message)",
                  "  ```"
                ),
                ""
              else
                empty
              end
            ' "$file" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "Failed to parse results." >> "$GITHUB_STEP_SUMMARY"

            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy-edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, e2e-tests, build, security-audit, prod-audit, extract-errors, deploy-edge-functions]
    if: always()
    steps:
      - run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint + Typecheck | ${{ needs.lint-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E (chromium) | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prod Audit (chromium) | ${{ fromJson(needs.prod-audit.results)['0'] }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prod Audit (firefox) | ${{ fromJson(needs.prod-audit.results)['1'] }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prod Audit (webkit) | ${{ fromJson(needs.prod-audit.results)['2'] }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prod Audit (mobile-chrome) | ${{ fromJson(needs.prod-audit.results)['3'] }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prod Audit (mobile-safari) | ${{ fromJson(needs.prod-audit.results)['4'] }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Extract Errors | ${{ needs.extract-errors.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Edge Functions | ${{ needs.deploy-edge-functions.result }} |" >> $GITHUB_STEP_SUMMARY