name: Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=6144'

permissions:
  contents: read

jobs:
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets
        run: |
          MISSING=0
          for SECRET in RENDER_SERVICE_ID RENDER_API_KEY; do
            if [ -z "${!SECRET}" ]; then
              echo "ERROR: $SECRET is not set"
              MISSING=1
            else
              echo "OK: $SECRET is set"
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "Required secrets are missing. Cannot deploy."
            exit 1
          fi
          echo "All required secrets are present."

  deploy-production:
    name: Deploy to Production (Render)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-secrets
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Trigger Render Deploy
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"auto": true}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Render deploy trigger returned $HTTP_CODE. Continuing - Render may auto-deploy from GitHub."
          fi

      - name: Wait for deploy
        run: |
          echo "Waiting for Render to deploy..."
          sleep 30
          echo "Deploy triggered. Check https://financiabr.me"

      - name: Verify deployment
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}" https://financiabr.me || echo "Health check failed"
          echo "Production deploy completed."

  deploy-staging:
    name: Deploy to Staging (Render)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-secrets
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Trigger Render Staging Deploy
        run: |
          echo "Staging deploy triggered for develop branch."
          echo "Render auto-deploy from develop branch should handle this."
          echo "Verify at your staging URL."

      - name: Verify staging deployment
        run: |
          echo "Staging deploy completed."